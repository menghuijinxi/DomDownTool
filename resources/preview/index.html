<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            color: #edf1ef;
            font: 13px "Microsoft YaHei", "Segoe UI", sans-serif;
        }

        .shell {
            position: relative;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        .toolbar {
            position: relative;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            height: 52px;
            padding: 0 12px;
            overflow: visible;
            border-bottom: 1px solid #3b403e;
            background: #222725;
        }

        .brand {
            display: flex;
            align-items: baseline;
            gap: 8px;
            width: 170px;
            min-width: 170px;
            color: #f4f6f5;
            font-size: 15px;
            font-weight: 700;
        }

        .brand span {
            color: #9aa49f;
            font-size: 11px;
            font-weight: 400;
        }

        .field {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #aeb7b2;
        }

        select {
            width: 184px;
            height: 30px;
            padding: 0 8px;
            border: 1px solid #505854;
            border-radius: 4px;
            outline: none;
            background: #181c1b;
            color: #edf1ef;
            font: inherit;
        }

        select:focus {
            border-color: #50a38b;
        }

        #provider-select {
            width: 160px;
        }

        .gis-field {
            flex: 0 0 171px;
            width: 171px;
            height: 30px;
        }

        #gis-overlay-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 141px;
            height: 30px;
            padding: 0 8px;
            border: 1px solid #505854;
            border-radius: 4px;
            background: #181c1b;
            color: #edf1ef;
            font: 13px "Microsoft YaHei", "Segoe UI", sans-serif;
        }

        #gis-overlay-toggle:focus {
            border-color: #50a38b;
        }

        #gis-overlay-summary {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #gis-overlay-arrow {
            flex: 0 0 auto;
            margin-left: 8px;
            color: #b8c1bd;
        }

        .gis-overlay-panel {
            position: absolute;
            z-index: 90;
            top: 48px;
            left: 735px;
            display: flex;
            flex-direction: column;
            width: 184px;
            padding: 6px;
            border: 1px solid #4a524e;
            border-radius: 4px;
            background: #1b201e;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.38);
        }

        .gis-overlay-option {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 28px;
            padding: 0 8px;
            color: #d8dfdc;
        }

        .gis-overlay-option:hover {
            background: #2c3934;
        }

        .gis-overlay-option.quick-option {
            border-bottom: 1px solid #343b38;
        }

        .gis-overlay-option input {
            flex: 0 0 auto;
            width: 16px;
            height: 16px;
        }

        .gis-overlay-option span {
            flex: 1;
        }

        .search-control {
            position: relative;
            flex: 0 0 300px;
            width: 300px;
            height: 32px;
        }

        .search-input-shell {
            display: flex;
            align-items: center;
            width: 100%;
            height: 32px;
            overflow: hidden;
            border: 1px solid #505854;
            border-radius: 4px;
            background: #181c1b;
        }

        .search-input-shell:focus-within {
            border-color: #50a38b;
        }

        #place-search-input {
            flex: 1;
            min-width: 0;
            height: 30px;
            padding: 0 9px;
            border: 0;
            outline: none;
            background: transparent;
            color: #edf1ef;
            font: inherit;
        }

        #place-search-input::placeholder {
            color: #7f8984;
        }

        #place-search-clear {
            width: 28px;
            height: 30px;
            color: #9ea8a3;
            font-size: 17px;
        }

        #place-search-submit {
            width: 48px;
            height: 30px;
            border-left: 1px solid #3f4743;
            background: #2c5146;
            color: #e3f4ed;
            font: 12px "Microsoft YaHei", "Segoe UI", sans-serif;
        }

        #place-search-submit:hover {
            background: #376559;
        }

        .search-results {
            position: absolute;
            z-index: 80;
            top: 48px;
            left: 192px;
            width: 360px;
            max-height: 374px;
            overflow-y: auto;
            border: 1px solid #4a524e;
            border-radius: 4px;
            background: #1b201e;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.38);
        }

        .search-result-list {
            display: flex;
            flex-direction: column;
            width: 100%;
            min-width: 0;
        }

        .search-result {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            width: 100%;
            height: 56px;
            padding: 6px 10px;
            overflow: hidden;
            border-bottom: 1px solid #303633;
            background: transparent;
            text-align: left;
        }

        .search-result:hover,
        .search-result.selected {
            background: #2c3934;
        }

        .search-result-name,
        .search-result-address {
            display: block;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .search-result-name {
            color: #f0f3f1;
            font-size: 13px;
        }

        .search-result-address {
            margin-top: 3px;
            color: #98a29d;
            font-size: 11px;
        }

        .search-state {
            min-height: 48px;
            padding: 15px 12px;
            color: #aab3af;
        }

        .search-error {
            color: #ef9d97;
        }

        .zoom-controls {
            display: flex;
            align-items: center;
            height: 30px;
            border: 1px solid #505854;
            border-radius: 4px;
            overflow: hidden;
            background: #181c1b;
        }

        button {
            width: 31px;
            height: 28px;
            border: 0;
            border-radius: 0;
            background: transparent;
            color: #edf1ef;
            font: 18px "Segoe UI", sans-serif;
        }

        button:hover {
            background: #343b38;
        }

        #zoom-value {
            min-width: 58px;
            color: #d9dfdc;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        #reload-tiles {
            width: 34px;
            border: 1px solid #505854;
            border-radius: 4px;
            font-size: 15px;
        }

        #auto-download-toggle {
            width: 72px;
            border: 1px solid #3d8d76;
            border-radius: 4px;
            background: #23463c;
            color: #d9f2e9;
            font: 12px "Microsoft YaHei", "Segoe UI", sans-serif;
        }

        #auto-download-toggle:hover {
            background: #2d5a4d;
        }

        #gis-color-toggle {
            width: 48px;
            border: 1px solid #505854;
            border-radius: 4px;
            color: #d9dfdc;
            font: 12px "Microsoft YaHei", "Segoe UI", sans-serif;
        }

        #gis-color-toggle:hover {
            background: #343b38;
        }

        .gis-color-panel {
            position: absolute;
            z-index: 90;
            top: 48px;
            left: 720px;
            width: 238px;
            padding: 9px;
            border: 1px solid #4a524e;
            border-radius: 4px;
            background: #1b201e;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.38);
        }

        .gis-color-row {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 30px;
        }

        .gis-color-row span {
            flex: 1;
            color: #d8dfdc;
        }

        .gis-color-row input {
            width: 92px;
            height: 24px;
            padding: 0 6px;
            border: 1px solid #505854;
            border-radius: 3px;
            outline: none;
            background: #181c1b;
            color: #edf1ef;
            font: 12px "Consolas", monospace;
        }

        .gis-color-row input:focus {
            border-color: #50a38b;
        }

        .toolbar-spacer {
            flex: 1;
        }

        .coordinate-chip {
            color: #b8c1bd;
            font-variant-numeric: tabular-nums;
        }

        .view-span-controls {
            display: flex;
            flex: 0 0 auto;
            align-items: center;
            height: 22px;
            overflow: hidden;
            border: 1px solid #49514d;
            border-radius: 4px;
            background: #181c1b;
        }

        .view-span-controls button {
            width: 24px;
            height: 20px;
            font-size: 13px;
        }

        #view-span-value {
            min-width: 68px;
            color: #d7ddda;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .map-overlay {
            position: relative;
            flex: 1;
            min-height: 0;
            pointer-events: none;
        }

        .source-line {
            position: absolute;
            top: 12px;
            left: 12px;
            display: flex;
            align-items: center;
            gap: 9px;
            height: 30px;
            padding: 0 9px;
            border-left: 3px solid #50a38b;
            background: rgba(28, 33, 31, 0.88);
        }

        #active-provider {
            font-weight: 650;
        }

        #coordinate-system {
            color: #aab4af;
            font-size: 11px;
        }

        .statusbar {
            display: flex;
            align-items: center;
            gap: 18px;
            width: 100%;
            height: 28px;
            padding: 0 10px;
            border-top: 1px solid #3b403e;
            background: #202523;
            color: #aeb7b2;
            font-size: 11px;
        }

        #cursor-coordinate,
        #center-coordinate {
            min-width: 150px;
            color: #d7ddda;
            font-variant-numeric: tabular-nums;
        }

        #cache-path {
            min-width: 0;
            overflow: hidden;
            color: #8f9994;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .status-spacer {
            flex: 1;
        }

        #tile-stats {
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <main class="shell">
        <header class="toolbar">
            <div class="brand">DomDownTool <span>瓦块预览</span></div>
            <div class="search-control">
                <div class="search-input-shell">
                    <input id="place-search-input" type="text" placeholder="搜索地点或地址" autocomplete="off">
                    <button id="place-search-clear" type="button" data-action="clear-place-search" title="清除搜索">&times;</button>
                    <button id="place-search-submit" type="button" data-action="submit-place-search">搜索</button>
                </div>
            </div>
            <label class="field">
                <span>地图</span>
                <select id="provider-select">
                    <option value="gaode.satellite" selected>高德卫星</option>
                    <option value="gaode.electronic">高德电子地图</option>
                    <option value="gaode.roads">高德透明路网</option>
                    <option value="tencent.satellite">腾讯卫星</option>
                    <option value="tianditu.satellite">天地图影像</option>
                    <option value="baidu.satellite">百度卫星</option>
                    <option value="google.satellite">Google 卫星</option>
                    <option value="bing.satellite">Bing 卫星</option>
                    <option value="arcgis.satellite">ArcGIS 影像</option>
                    <option value="none">无</option>
                </select>
            </label>
            <div class="field gis-field">
                <span>GIS</span>
                <button id="gis-overlay-toggle" type="button" data-action="toggle-gis-overlay"
                        aria-haspopup="true" aria-expanded="false">
                    <span id="gis-overlay-summary">无</span>
                    <span id="gis-overlay-arrow">v</span>
                </button>
            </div>
            <button id="gis-color-toggle" type="button" data-action="toggle-gis-colors">颜色</button>
            <div class="zoom-controls">
                <button id="zoom-out" type="button" data-action="zoom-out" title="缩小">-</button>
                <span id="zoom-value">Z 15.00</span>
                <button id="zoom-in" type="button" data-action="zoom-in" title="放大">+</button>
            </div>
            <button id="auto-download-toggle" type="button" data-action="toggle-auto-download" title="切换自动下载或仅使用缓存">自动下载</button>
            <button id="reload-tiles" type="button" data-action="reload-tiles" title="重新读取缓存">&#x21bb;</button>
            <div class="toolbar-spacer"></div>
        </header>

        <div id="gis-overlay-panel" class="gis-overlay-panel" style="display: none">
            <label class="gis-overlay-option quick-option" for="gis-overlay-none">
                <input id="gis-overlay-none" type="checkbox" name="gis-overlay" value="none" checked>
                <span>无</span>
            </label>
            <label class="gis-overlay-option quick-option" for="gis-overlay-all">
                <input id="gis-overlay-all" type="checkbox" name="gis-overlay" value="all">
                <span>全部</span>
            </label>
            <label class="gis-overlay-option" for="gis-overlay-road">
                <input id="gis-overlay-road" type="checkbox" name="gis-overlay" value="road">
                <span>道路</span>
            </label>
            <label class="gis-overlay-option" for="gis-overlay-water">
                <input id="gis-overlay-water" type="checkbox" name="gis-overlay" value="water">
                <span>水</span>
            </label>
            <label class="gis-overlay-option" for="gis-overlay-green">
                <input id="gis-overlay-green" type="checkbox" name="gis-overlay" value="green">
                <span>绿地</span>
            </label>
            <label class="gis-overlay-option" for="gis-overlay-highway">
                <input id="gis-overlay-highway" type="checkbox" name="gis-overlay" value="highway">
                <span>高速</span>
            </label>
            <label class="gis-overlay-option" for="gis-overlay-subway">
                <input id="gis-overlay-subway" type="checkbox" name="gis-overlay" value="subway">
                <span>地铁</span>
            </label>
            <label class="gis-overlay-option" for="gis-overlay-building">
                <input id="gis-overlay-building" type="checkbox" name="gis-overlay" value="building">
                <span>建筑</span>
            </label>
            <label class="gis-overlay-option" for="gis-overlay-point">
                <input id="gis-overlay-point" type="checkbox" name="gis-overlay" value="point">
                <span>点</span>
            </label>
            <label class="gis-overlay-option" for="gis-overlay-boundary">
                <input id="gis-overlay-boundary" type="checkbox" name="gis-overlay" value="boundary">
                <span>边界</span>
            </label>
            <label class="gis-overlay-option" for="gis-overlay-other">
                <input id="gis-overlay-other" type="checkbox" name="gis-overlay" value="other">
                <span>其他</span>
            </label>
        </div>

        <div id="gis-color-panel" class="gis-color-panel" style="display: none">
            <div class="gis-color-row"><span>道路</span><input id="gis-color-road" type="text" value="#F0C641" maxlength="7"></div>
            <div class="gis-color-row"><span>水</span><input id="gis-color-water" type="text" value="#42A5F5" maxlength="7"></div>
            <div class="gis-color-row"><span>绿地</span><input id="gis-color-green" type="text" value="#43A047" maxlength="7"></div>
            <div class="gis-color-row"><span>高速</span><input id="gis-color-highway" type="text" value="#FF6F38" maxlength="7"></div>
            <div class="gis-color-row"><span>地铁</span><input id="gis-color-subway" type="text" value="#D24BDC" maxlength="7"></div>
            <div class="gis-color-row"><span>建筑</span><input id="gis-color-building" type="text" value="#B4B4B4" maxlength="7"></div>
            <div class="gis-color-row"><span>点</span><input id="gis-color-point" type="text" value="#E53935" maxlength="7"></div>
            <div class="gis-color-row"><span>边界</span><input id="gis-color-boundary" type="text" value="#536E7A" maxlength="7"></div>
            <div class="gis-color-row"><span>其他</span><input id="gis-color-other" type="text" value="#607D8B" maxlength="7"></div>
        </div>

        <div id="place-search-results" class="search-results" style="display: none">
            <div id="place-search-results-content"></div>
        </div>

        <section class="map-overlay">
            <div class="source-line">
                <span id="active-provider">高德卫星</span>
                <span id="coordinate-system">GCJ02 / XYZ</span>
            </div>
        </section>

        <footer class="statusbar">
            <span id="cursor-coordinate">116.397389, 39.908722</span>
            <span class="coordinate-chip" id="center-coordinate">116.397389, 39.908722</span>
            <div class="view-span-controls">
                <button id="view-span-decrease" type="button" data-action="view-span-decrease" title="减少可见瓦块">-</button>
                <span id="view-span-value">视野 1.0x</span>
                <button id="view-span-increase" type="button" data-action="view-span-increase" title="显示更多瓦块">+</button>
            </div>
            <span id="cache-path">cache/高德地图</span>
            <div class="status-spacer"></div>
            <span id="tile-stats">可见 0  已载入 0  读取 0  下载 0/0  失败 0  缓存 0.0 MB</span>
        </footer>
    </main>
</body>
</html>
