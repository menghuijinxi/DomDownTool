<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            color: #edf1ef;
            font: 13px "Microsoft YaHei", "Segoe UI", sans-serif;
        }

        .shell {
            position: relative;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        .toolbar {
            position: relative;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            height: 52px;
            padding: 0 12px;
            overflow: visible;
            border-bottom: 1px solid #3b403e;
            background: #222725;
        }

        .brand {
            display: flex;
            align-items: baseline;
            gap: 8px;
            width: 170px;
            min-width: 170px;
            color: #f4f6f5;
            font-size: 15px;
            font-weight: 700;
        }

        .brand span {
            color: #9aa49f;
            font-size: 11px;
            font-weight: 400;
        }

        .field {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #aeb7b2;
        }

        select {
            width: 184px;
            height: 30px;
            padding: 0 8px;
            border: 1px solid #505854;
            border-radius: 4px;
            outline: none;
            background: #181c1b;
            color: #edf1ef;
            font: inherit;
        }

        select:focus {
            border-color: #50a38b;
        }

        #provider-select {
            width: 160px;
        }

        .gis-field {
            flex: 0 0 171px;
            width: 171px;
            height: 30px;
        }

        #gis-overlay-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 141px;
            height: 30px;
            padding: 0 8px;
            border: 1px solid #505854;
            border-radius: 4px;
            background: #181c1b;
            color: #edf1ef;
            font: 13px "Microsoft YaHei", "Segoe UI", sans-serif;
        }

        #gis-overlay-toggle:focus {
            border-color: #50a38b;
        }

        #gis-overlay-summary {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #gis-overlay-arrow {
            flex: 0 0 auto;
            margin-left: 8px;
            color: #b8c1bd;
        }

        .gis-overlay-panel {
            position: absolute;
            z-index: 90;
            top: 48px;
            left: 735px;
            display: flex;
            flex-direction: column;
            width: 184px;
            padding: 6px;
            border: 1px solid #4a524e;
            border-radius: 4px;
            background: #1b201e;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.38);
        }

        .gis-overlay-option {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 28px;
            padding: 0 8px;
            color: #d8dfdc;
        }

        .gis-overlay-option:hover {
            background: #2c3934;
        }

        .gis-overlay-option.quick-option {
            border-bottom: 1px solid #343b38;
        }

        .gis-overlay-option input {
            flex: 0 0 auto;
            width: 16px;
            height: 16px;
        }

        .gis-overlay-option span {
            flex: 1;
        }

        .search-control {
            position: relative;
            flex: 0 0 300px;
            width: 300px;
            height: 32px;
        }

        .search-input-shell {
            display: flex;
            align-items: center;
            width: 100%;
            height: 32px;
            overflow: hidden;
            border: 1px solid #505854;
            border-radius: 4px;
            background: #181c1b;
        }

        .search-input-shell:focus-within {
            border-color: #50a38b;
        }

        #place-search-input {
            flex: 1;
            min-width: 0;
            height: 30px;
            padding: 0 9px;
            border: 0;
            outline: none;
            background: transparent;
            color: #edf1ef;
            font: inherit;
        }

        #place-search-input::placeholder {
            color: #7f8984;
        }

        #place-search-clear {
            width: 28px;
            height: 30px;
            color: #9ea8a3;
            font-size: 17px;
        }

        #place-search-submit {
            width: 48px;
            height: 30px;
            border-left: 1px solid #3f4743;
            background: #2c5146;
            color: #e3f4ed;
            font: 12px "Microsoft YaHei", "Segoe UI", sans-serif;
        }

        #place-search-submit:hover {
            background: #376559;
        }

        .search-results {
            position: absolute;
            z-index: 80;
            top: 48px;
            left: 192px;
            width: 360px;
            max-height: 374px;
            overflow-y: auto;
            border: 1px solid #4a524e;
            border-radius: 4px;
            background: #1b201e;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.38);
        }

        .search-result-list {
            display: flex;
            flex-direction: column;
            width: 100%;
            min-width: 0;
        }

        .search-result {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            width: 100%;
            height: 56px;
            padding: 6px 10px;
            overflow: hidden;
            border-bottom: 1px solid #303633;
            background: transparent;
            text-align: left;
        }

        .search-result:hover,
        .search-result.selected {
            background: #2c3934;
        }

        .search-result-name,
        .search-result-address {
            display: block;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .search-result-name {
            color: #f0f3f1;
            font-size: 13px;
        }

        .search-result-address {
            margin-top: 3px;
            color: #98a29d;
            font-size: 11px;
        }

        .search-state {
            min-height: 48px;
            padding: 15px 12px;
            color: #aab3af;
        }

        .search-error {
            color: #ef9d97;
        }

        .zoom-controls {
            display: flex;
            align-items: center;
            height: 30px;
            border: 1px solid #505854;
            border-radius: 4px;
            overflow: hidden;
            background: #181c1b;
        }

        button {
            width: 31px;
            height: 28px;
            border: 0;
            border-radius: 0;
            background: transparent;
            color: #edf1ef;
            font: 18px "Segoe UI", sans-serif;
        }

        button:hover {
            background: #343b38;
        }

        #zoom-value {
            min-width: 58px;
            color: #d9dfdc;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        #reload-tiles {
            width: 34px;
            border: 1px solid #505854;
            border-radius: 4px;
            font-size: 15px;
        }

        #gis-color-toggle {
            width: 48px;
            border: 1px solid #505854;
            border-radius: 4px;
            color: #d9dfdc;
            font: 12px "Microsoft YaHei", "Segoe UI", sans-serif;
        }

        #gis-color-toggle:hover {
            background: #343b38;
        }

        .gis-color-panel {
            position: absolute;
            z-index: 90;
            top: 48px;
            left: 720px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            width: 320px;
            height: 540px;
            padding: 10px;
            border: 1px solid #4a524e;
            border-radius: 4px;
            background: #1b201e;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.38);
        }

        .gis-color-row {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            height: 30px;
        }

        .gis-color-label {
            flex: 1;
            min-width: 0;
            color: #d8dfdc;
        }

        .gis-color-swatch {
            flex: 0 0 26px;
            width: 26px;
            height: 24px;
            padding: 0;
            border: 1px solid #66706b;
            border-radius: 3px;
        }

        .gis-color-swatch:focus {
            border-color: #edf1ef;
        }

        .gis-color-swatch[aria-pressed="true"] {
            border-color: #edf1ef;
            box-shadow: 0 0 0 1px #50a38b;
        }

        .gis-color-value {
            flex: 0 0 92px;
            width: 92px;
            height: 24px;
            padding: 0 6px;
            border: 1px solid #505854;
            border-radius: 3px;
            outline: none;
            background: #181c1b;
            color: #edf1ef;
            font: 12px "Consolas", monospace;
        }

        .gis-color-value:focus {
            border-color: #50a38b;
        }

        .gis-color-palette {
            position: absolute;
            top: 343px;
            left: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 300px;
            padding-top: 9px;
            border-top: 1px solid #343b38;
        }

        .gis-color-palette-title {
            display: flex;
            justify-content: space-between;
            height: 18px;
            color: #aeb7b2;
            font-size: 12px;
        }

        #gis-color-palette-target {
            color: #edf1ef;
        }

        .gis-color-picker-body {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            height: 150px;
        }

        .gis-color-picker-field {
            position: relative;
            flex: 0 0 190px;
            width: 190px;
            height: 150px;
            overflow: visible;
            border: 1px solid #818a86;
            background-color: #ff0000;
            background-image:
                linear-gradient(to bottom, transparent 0%, #000000 100%),
                linear-gradient(to right, #ffffff 0%, transparent 100%);
            cursor: crosshair;
        }

        .gis-color-picker-marker {
            position: absolute;
            left: 0;
            top: 0;
            width: 10px;
            height: 10px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 0 1px #101312;
            pointer-events: none;
        }

        .gis-color-hue {
            position: relative;
            flex: 0 0 20px;
            width: 20px;
            height: 150px;
            overflow: visible;
            border: 1px solid #818a86;
            background: linear-gradient(
                to bottom,
                #ff0000 0%,
                #ffff00 16.67%,
                #00ff00 33.33%,
                #00ffff 50%,
                #0000ff 66.67%,
                #ff00ff 83.33%,
                #ff0000 100%
            );
            cursor: ns-resize;
        }

        .gis-color-hue-marker {
            position: absolute;
            left: -3px;
            top: 0;
            width: 26px;
            height: 4px;
            border: 1px solid #ffffff;
            background: #171a19;
            box-shadow: 0 0 0 1px #101312;
            pointer-events: none;
        }

        .gis-color-picker-readout {
            display: flex;
            flex: 1;
            flex-direction: column;
            align-items: stretch;
            gap: 6px;
            min-width: 0;
        }

        .gis-color-current {
            height: 40px;
            border: 1px solid #818a86;
            background: #ffda71;
        }

        .gis-color-channel {
            display: flex;
            justify-content: space-between;
            height: 17px;
            color: #9fa9a4;
            font: 11px "Consolas", monospace;
        }

        .gis-color-channel strong {
            color: #edf1ef;
            font-weight: normal;
        }

        .gis-color-picker-actions {
            display: flex;
            gap: 4px;
            width: 100%;
        }

        .gis-color-tool-button {
            flex: 1 1 0;
            height: 24px;
            padding: 0;
            border: 1px solid #59635e;
            border-radius: 3px;
            background: #242a27;
            color: #dce3df;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gis-color-tool-button svg {
            width: 16px;
            height: 16px;
            fill: none;
            pointer-events: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 1.7;
        }

        .gis-color-tool-button:hover,
        .gis-color-eyedropper[aria-pressed="true"] {
            border-color: #4cae91;
            background: #285044;
            color: #f1faf7;
        }

        .toolbar-spacer {
            flex: 1;
        }

        .coordinate-chip {
            color: #b8c1bd;
            font-variant-numeric: tabular-nums;
        }

        .view-span-controls {
            display: flex;
            flex: 0 0 auto;
            align-items: center;
            height: 22px;
            overflow: hidden;
            border: 1px solid #49514d;
            border-radius: 4px;
            background: #181c1b;
        }

        .view-span-controls button {
            width: 24px;
            height: 20px;
            font-size: 13px;
        }

        #view-span-value {
            min-width: 68px;
            color: #d7ddda;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .map-overlay {
            position: relative;
            flex: 1;
            min-height: 0;
            pointer-events: none;
        }

        .source-line {
            position: absolute;
            top: 12px;
            left: 12px;
            display: flex;
            align-items: center;
            gap: 9px;
            height: 30px;
            padding: 0 9px;
            border-left: 3px solid #50a38b;
            background: rgba(28, 33, 31, 0.88);
        }

        #active-provider {
            font-weight: 650;
        }

        #coordinate-system {
            color: #aab4af;
            font-size: 11px;
        }

        .statusbar {
            display: flex;
            align-items: center;
            gap: 18px;
            width: 100%;
            height: 28px;
            padding: 0 10px;
            border-top: 1px solid #3b403e;
            background: #202523;
            color: #aeb7b2;
            font-size: 11px;
        }

        #cursor-coordinate,
        #center-coordinate {
            min-width: 150px;
            color: #d7ddda;
            font-variant-numeric: tabular-nums;
        }

        #cache-path {
            min-width: 0;
            overflow: hidden;
            color: #8f9994;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .status-spacer {
            flex: 1;
        }

        #tile-stats {
            white-space: nowrap;
        }

        button {
            cursor: pointer;
        }

        .radius-control {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #aeb7b2;
            white-space: nowrap;
        }

        .radius-control input {
            width: 72px;
            height: 30px;
            padding: 0 7px;
            border: 1px solid #505854;
            border-radius: 4px;
            outline: none;
            background: #181c1b;
            color: #edf1ef;
            font: inherit;
            text-align: right;
        }

        .radius-control input:focus,
        .form-field input:focus,
        .form-field select:focus {
            border-color: #50a38b;
        }

        .primary-command,
        .secondary-command,
        .danger-command {
            height: 30px;
            padding: 0 12px;
            border: 1px solid #4e5a55;
            border-radius: 4px;
            background: #252c29;
            color: #edf1ef;
            font: inherit;
            white-space: nowrap;
        }

        .primary-command {
            border-color: #4cae91;
            background: #285a4b;
        }

        .primary-command:hover {
            background: #32705d;
        }

        .secondary-command:hover {
            border-color: #6d7973;
            background: #303835;
        }

        .danger-command {
            border-color: #774f4d;
            color: #ffc7c2;
        }

        #open-export-page,
        #open-task-page,
        #export-back-preview,
        #tasks-back-preview {
            flex: 0 0 64px;
            width: 64px;
            min-width: 64px;
        }

        .workspace-page {
            position: relative;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #191d1c;
        }

        .page-header {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 0 0 56px;
            height: 56px;
            padding: 0 18px;
            border-bottom: 1px solid #3b403e;
            background: #222725;
        }

        .page-header h1 {
            margin: 0;
            color: #f3f6f5;
            font-size: 17px;
            font-weight: 650;
            letter-spacing: 0;
        }

        .page-header-summary {
            flex: 0 0 420px;
            width: 420px;
            min-width: 0;
            overflow: hidden;
            color: #929d98;
            font-size: 12px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .page-header-spacer {
            flex: 1;
            min-width: 0;
        }

        #export-open-tasks {
            width: 96px;
            min-width: 96px;
        }

        #tasks-new-export {
            width: 90px;
            min-width: 90px;
        }

        #tasks-clear-finished {
            width: 128px;
            min-width: 128px;
        }

        .page-content {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }

        .export-layout {
            display: grid;
            grid-template-columns: minmax(420px, 0.95fr) minmax(480px, 1.05fr);
            gap: 0;
            min-height: 100%;
        }

        .export-column {
            min-width: 0;
            padding: 20px 24px 28px;
        }

        .export-column + .export-column {
            border-left: 1px solid #343a37;
        }

        .settings-section {
            margin-bottom: 24px;
        }

        .settings-section h2 {
            margin: 0 0 12px;
            color: #e8edeb;
            font-size: 14px;
            font-weight: 650;
            letter-spacing: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
            color: #aab4af;
            font-size: 12px;
        }

        .form-field.full {
            grid-column: 1 / -1;
        }

        .form-field input,
        .form-field select {
            width: 100%;
            height: 34px;
            padding: 0 9px;
            border: 1px solid #4d5551;
            border-radius: 4px;
            outline: none;
            background: #151918;
            color: #edf1ef;
            font: 13px "Microsoft YaHei", "Segoe UI", sans-serif;
        }

        .output-options {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            border-top: 1px solid #343a37;
        }

        .output-option {
            display: flex;
            align-items: center;
            gap: 9px;
            min-height: 42px;
            padding: 0 8px;
            border-bottom: 1px solid #343a37;
            color: #dce3df;
        }

        .output-option:nth-child(odd) {
            border-right: 1px solid #343a37;
        }

        .output-option input {
            width: 16px;
            height: 16px;
        }

        .gis-group-list {
            min-height: 42px;
            display: grid;
            border-top: 1px solid #343a37;
        }

        .gis-group-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .gis-group-item {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 0;
            min-height: 42px;
            padding: 0 8px;
            border-bottom: 1px solid #343a37;
            color: #dce3df;
        }

        .gis-group-item:nth-child(odd) {
            border-right: 1px solid #343a37;
        }

        .gis-group-item input {
            flex: 0 0 16px;
            width: 16px;
            height: 16px;
        }

        .gis-group-item.merged {
            background: #2d2a20;
        }

        .gis-group-label {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .gis-group-count {
            margin-left: auto;
            color: #9eaaa4;
            font-size: 11px;
        }

        .export-footer {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-top: 16px;
            border-top: 1px solid #343a37;
        }

        .validation-message {
            width: 420px;
            min-width: 420px;
            color: #ffaaa2;
            font-size: 12px;
        }

        #export-cancel {
            width: 64px;
            min-width: 64px;
        }

        #export-submit {
            width: 128px;
            min-width: 128px;
        }

        .task-summary-band {
            display: flex;
            align-items: center;
            gap: 24px;
            height: 48px;
            padding: 0 24px;
            border-bottom: 1px solid #343a37;
            background: #1d2220;
            color: #a8b2ad;
        }

        .task-summary-band strong {
            color: #eef3f0;
            font-weight: 600;
        }

        .task-list {
            width: 100%;
        }

        .task-row {
            display: grid;
            grid-template-columns: minmax(240px, 1.3fr) minmax(220px, 1fr) 150px 90px;
            gap: 18px;
            align-items: center;
            min-height: 96px;
            padding: 14px 24px;
            border-bottom: 1px solid #343a37;
            background: #191d1c;
        }

        .task-row:hover {
            background: #1d2321;
        }

        .task-title {
            margin-bottom: 5px;
            color: #eef3f0;
            font-weight: 600;
        }

        .task-detail,
        .task-output,
        .task-time,
        .task-error {
            overflow: hidden;
            color: #8f9a95;
            font-size: 11px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .task-error {
            margin-top: 4px;
            color: #ffaaa2;
        }

        .task-stage {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 7px;
            color: #cbd4d0;
            font-size: 12px;
        }

        .progress-track {
            width: 100%;
            height: 6px;
            overflow: hidden;
            background: #303633;
        }

        .progress-value {
            height: 100%;
            background: #55aa8f;
        }

        .task-state {
            justify-self: start;
            padding: 4px 8px;
            border: 1px solid #4b5550;
            border-radius: 3px;
            color: #cdd6d2;
            font-size: 11px;
        }

        .task-state.running {
            border-color: #4cae91;
            color: #88d9be;
        }

        .task-state.succeeded {
            border-color: #668d69;
            color: #9bd49e;
        }

        .task-state.failed,
        .task-state.canceled {
            border-color: #855955;
            color: #ffaaa2;
        }

        .task-row-actions .danger-command {
            width: 64px;
            min-width: 64px;
        }

        .task-empty {
            padding: 80px 24px;
            color: #828d88;
            text-align: center;
        }

        @media (max-width: 1100px) {
            .page-header-spacer {
                display: none;
            }

            .export-layout {
                grid-template-columns: 1fr;
            }

            .export-column + .export-column {
                border-top: 1px solid #343a37;
                border-left: 0;
            }

            .task-row {
                grid-template-columns: minmax(220px, 1fr) minmax(200px, 1fr) 100px;
            }

            .task-row-actions {
                grid-column: 1 / -1;
            }
        }
    </style>
</head>
<body>
    <main id="preview-page" class="shell">
        <header class="toolbar">
            <div class="brand">DomDownTool <span>瓦块预览</span></div>
            <div class="search-control">
                <div class="search-input-shell">
                    <input id="place-search-input" type="text" placeholder="搜索地点或地址" autocomplete="off">
                    <button id="place-search-clear" type="button" data-action="clear-place-search" title="清除搜索">&times;</button>
                    <button id="place-search-submit" type="button" data-action="submit-place-search">搜索</button>
                </div>
            </div>
            <label class="field">
                <span>地图</span>
                <select id="provider-select">
                    <option value="gaode.satellite" selected>高德卫星</option>
                    <option value="gaode.electronic">高德电子地图</option>
                    <option value="gaode.roads">高德透明路网</option>
                    <option value="tencent.satellite">腾讯卫星</option>
                    <option value="tianditu.satellite">天地图影像</option>
                    <option value="baidu.satellite">百度卫星</option>
                    <option value="google.satellite">Google 卫星</option>
                    <option value="bing.satellite">Bing 卫星</option>
                    <option value="arcgis.satellite">ArcGIS 影像</option>
                    <option value="none">无</option>
                </select>
            </label>
            <div class="field gis-field">
                <span>GIS</span>
                <button id="gis-overlay-toggle" type="button" data-action="toggle-gis-overlay"
                        aria-haspopup="true" aria-expanded="false">
                    <span id="gis-overlay-summary">无</span>
                    <span id="gis-overlay-arrow">v</span>
                </button>
            </div>
            <button id="gis-color-toggle" type="button" data-action="toggle-gis-colors">颜色</button>
            <div class="zoom-controls">
                <button id="zoom-out" type="button" data-action="zoom-out" title="缩小">-</button>
                <span id="zoom-value">Z 15.00</span>
                <button id="zoom-in" type="button" data-action="zoom-in" title="放大">+</button>
            </div>
            <label class="radius-control">
                <span>半径</span>
                <input id="export-radius" type="number" min="0" step="100" value="0"
                       aria-label="导出半径（米）">
                <span>米</span>
            </label>
            <button id="open-export-page" class="primary-command" type="button"
                    data-action="open-export-config">导出</button>
            <button id="open-task-page" class="secondary-command" type="button"
                    data-action="open-export-tasks">任务</button>
            <button id="reload-tiles" type="button" data-action="reload-tiles" title="重新读取缓存">&#x21bb;</button>
            <div class="toolbar-spacer"></div>
        </header>

        <div id="gis-overlay-panel" class="gis-overlay-panel" style="display: none">
            <label class="gis-overlay-option quick-option" for="gis-overlay-none">
                <input id="gis-overlay-none" type="checkbox" name="gis-overlay" value="none" checked>
                <span>无</span>
            </label>
            <label class="gis-overlay-option quick-option" for="gis-overlay-all">
                <input id="gis-overlay-all" type="checkbox" name="gis-overlay" value="all">
                <span>全部</span>
            </label>
            <label class="gis-overlay-option" for="gis-overlay-road">
                <input id="gis-overlay-road" type="checkbox" name="gis-overlay" value="road">
                <span>道路</span>
            </label>
            <label class="gis-overlay-option" for="gis-overlay-water">
                <input id="gis-overlay-water" type="checkbox" name="gis-overlay" value="water">
                <span>水</span>
            </label>
            <label class="gis-overlay-option" for="gis-overlay-green">
                <input id="gis-overlay-green" type="checkbox" name="gis-overlay" value="green">
                <span>绿地</span>
            </label>
            <label class="gis-overlay-option" for="gis-overlay-highway">
                <input id="gis-overlay-highway" type="checkbox" name="gis-overlay" value="highway">
                <span>高速</span>
            </label>
            <label class="gis-overlay-option" for="gis-overlay-subway">
                <input id="gis-overlay-subway" type="checkbox" name="gis-overlay" value="subway">
                <span>地铁</span>
            </label>
            <label class="gis-overlay-option" for="gis-overlay-building">
                <input id="gis-overlay-building" type="checkbox" name="gis-overlay" value="building">
                <span>建筑</span>
            </label>
            <label class="gis-overlay-option" for="gis-overlay-point">
                <input id="gis-overlay-point" type="checkbox" name="gis-overlay" value="point">
                <span>点</span>
            </label>
            <label class="gis-overlay-option" for="gis-overlay-boundary">
                <input id="gis-overlay-boundary" type="checkbox" name="gis-overlay" value="boundary">
                <span>边界</span>
            </label>
            <label class="gis-overlay-option" for="gis-overlay-other">
                <input id="gis-overlay-other" type="checkbox" name="gis-overlay" value="other">
                <span>其他</span>
            </label>
        </div>

        <div id="gis-color-panel" class="gis-color-panel" style="display: none">
            <div class="gis-color-row">
                <span class="gis-color-label">道路</span>
                <button id="gis-color-target-road" class="gis-color-swatch" type="button"
                        title="选择道路颜色" aria-label="选择道路颜色"
                        style="background-color: #FFDA71"></button>
                <input id="gis-color-road" class="gis-color-value" type="text" value="#FFDA71"
                       maxlength="7" aria-label="道路颜色">
            </div>
            <div class="gis-color-row">
                <span class="gis-color-label">水</span>
                <button id="gis-color-target-water" class="gis-color-swatch" type="button"
                        title="选择水颜色" aria-label="选择水颜色"
                        style="background-color: #6A8ECA"></button>
                <input id="gis-color-water" class="gis-color-value" type="text" value="#6A8ECA"
                       maxlength="7" aria-label="水颜色">
            </div>
            <div class="gis-color-row">
                <span class="gis-color-label">绿地</span>
                <button id="gis-color-target-green" class="gis-color-swatch" type="button"
                        title="选择绿地颜色" aria-label="选择绿地颜色"
                        style="background-color: #53854E"></button>
                <input id="gis-color-green" class="gis-color-value" type="text" value="#53854E"
                       maxlength="7" aria-label="绿地颜色">
            </div>
            <div class="gis-color-row">
                <span class="gis-color-label">高速</span>
                <button id="gis-color-target-highway" class="gis-color-swatch" type="button"
                        title="选择高速颜色" aria-label="选择高速颜色"
                        style="background-color: #FF6F38"></button>
                <input id="gis-color-highway" class="gis-color-value" type="text" value="#FF6F38"
                       maxlength="7" aria-label="高速颜色">
            </div>
            <div class="gis-color-row">
                <span class="gis-color-label">地铁</span>
                <button id="gis-color-target-subway" class="gis-color-swatch" type="button"
                        title="选择地铁颜色" aria-label="选择地铁颜色"
                        style="background-color: #D24BDC"></button>
                <input id="gis-color-subway" class="gis-color-value" type="text" value="#D24BDC"
                       maxlength="7" aria-label="地铁颜色">
            </div>
            <div class="gis-color-row">
                <span class="gis-color-label">建筑</span>
                <button id="gis-color-target-building" class="gis-color-swatch" type="button"
                        title="选择建筑颜色" aria-label="选择建筑颜色"
                        style="background-color: #FFFFFF"></button>
                <input id="gis-color-building" class="gis-color-value" type="text" value="#FFFFFF"
                       maxlength="7" aria-label="建筑颜色">
            </div>
            <div class="gis-color-row">
                <span class="gis-color-label">点</span>
                <button id="gis-color-target-point" class="gis-color-swatch" type="button"
                        title="选择点颜色" aria-label="选择点颜色"
                        style="background-color: #E53935"></button>
                <input id="gis-color-point" class="gis-color-value" type="text" value="#E53935"
                       maxlength="7" aria-label="点颜色">
            </div>
            <div class="gis-color-row">
                <span class="gis-color-label">边界</span>
                <button id="gis-color-target-boundary" class="gis-color-swatch" type="button"
                        title="选择边界颜色" aria-label="选择边界颜色"
                        style="background-color: #363738"></button>
                <input id="gis-color-boundary" class="gis-color-value" type="text" value="#363738"
                       maxlength="7" aria-label="边界颜色">
            </div>
            <div class="gis-color-row">
                <span class="gis-color-label">其他</span>
                <button id="gis-color-target-other" class="gis-color-swatch" type="button"
                        title="选择其他颜色" aria-label="选择其他颜色"
                        style="background-color: #607D8B"></button>
                <input id="gis-color-other" class="gis-color-value" type="text" value="#607D8B"
                       maxlength="7" aria-label="其他颜色">
            </div>
            <div id="gis-color-picker" class="gis-color-palette">
                <div class="gis-color-palette-title">
                    <span>取色器</span>
                    <span id="gis-color-palette-target">道路</span>
                </div>
                <div id="gis-color-picker-body" class="gis-color-picker-body">
                    <div id="gis-color-picker-field" class="gis-color-picker-field"
                         data-action="pick-gis-color" role="slider"
                         aria-label="饱和度与明度">
                        <span id="gis-color-picker-marker"
                              class="gis-color-picker-marker"></span>
                    </div>
                    <div id="gis-color-picker-hue" class="gis-color-hue"
                         data-action="pick-gis-hue" role="slider"
                         aria-label="色相">
                        <span id="gis-color-hue-marker"
                              class="gis-color-hue-marker"></span>
                    </div>
                    <div id="gis-color-picker-readout" class="gis-color-picker-readout">
                        <div id="gis-color-current" class="gis-color-current"></div>
                        <div class="gis-color-channel"><span>H</span><strong id="gis-color-hue-value">0°</strong></div>
                        <div class="gis-color-channel"><span>S</span><strong id="gis-color-saturation-value">0%</strong></div>
                        <div class="gis-color-channel"><span>B</span><strong id="gis-color-brightness-value">0%</strong></div>
                        <div id="gis-color-picker-actions" class="gis-color-picker-actions">
                            <button id="gis-color-eyedropper"
                                    class="gis-color-tool-button gis-color-eyedropper"
                                    type="button" data-action="pick-window-color"
                                    aria-pressed="false" aria-label="从屏幕吸取颜色"
                                    title="从屏幕吸取颜色">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="m14.5 4.5 5 5"/>
                                    <path d="m13 6 5 5"/>
                                    <path d="m17.5 2.5 4 4-8.75 8.75a2.83 2.83 0 0 1-4 0l-.5-.5a2.83 2.83 0 0 1 0-4z"/>
                                    <path d="m8.25 11.75-3.5 3.5"/>
                                    <path d="M4.75 15.25 3 21l5.75-1.75"/>
                                </svg>
                            </button>
                            <button id="gis-color-reset" class="gis-color-tool-button"
                                    type="button" data-action="reset-gis-colors"
                                    aria-label="恢复默认颜色" title="恢复默认颜色">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M3 12a9 9 0 1 0 3-6.7"/>
                                    <path d="M3 4v6h6"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="place-search-results" class="search-results" style="display: none">
            <div id="place-search-results-content"></div>
        </div>

        <section class="map-overlay">
            <div class="source-line">
                <span id="active-provider">高德卫星</span>
                <span id="coordinate-system">GCJ02 / XYZ</span>
            </div>
        </section>

        <footer class="statusbar">
            <span id="cursor-coordinate">116.397389, 39.908722</span>
            <span class="coordinate-chip" id="center-coordinate">116.397389, 39.908722</span>
            <div class="view-span-controls">
                <button id="view-span-decrease" type="button" data-action="view-span-decrease" title="减少可见瓦块">-</button>
                <span id="view-span-value">视野 1.0x</span>
                <button id="view-span-increase" type="button" data-action="view-span-increase" title="显示更多瓦块">+</button>
            </div>
            <span id="cache-path">cache/高德地图</span>
            <div class="status-spacer"></div>
            <span id="tile-stats">可见 0  已载入 0  读取 0  下载 0/0  失败 0  缓存 0.0 MB</span>
        </footer>
    </main>

    <section id="export-page" class="workspace-page" style="display: none">
        <header id="export-page-header" class="page-header">
            <h1>导出配置</h1>
            <span id="export-config-summary" class="page-header-summary"></span>
            <div class="page-header-spacer"></div>
            <button id="export-open-tasks" class="secondary-command" type="button"
                    data-action="open-export-tasks">导出任务</button>
            <button id="export-back-preview" class="secondary-command" type="button"
                    data-action="back-to-preview">返回</button>
        </header>
        <div class="page-content">
            <div class="export-layout">
                <div class="export-column">
                    <section class="settings-section">
                        <h2>导出范围</h2>
                        <div class="form-grid">
                            <label class="form-field">
                                <span>中心经度</span>
                                <input id="export-lon" type="number" step="0.000001">
                            </label>
                            <label class="form-field">
                                <span>中心纬度</span>
                                <input id="export-lat" type="number" step="0.000001">
                            </label>
                            <label class="form-field">
                                <span>半径（米）</span>
                                <input id="export-config-radius" type="number" min="0" step="100">
                            </label>
                            <label class="form-field">
                                <span>层级</span>
                                <input id="export-zoom" type="number" min="1" max="21" step="1">
                            </label>
                            <label class="form-field full">
                                <span>卫星图来源</span>
                                <select id="export-provider-select">
                                    <option value="gaode.satellite">高德卫星</option>
                                    <option value="gaode.electronic">高德电子地图</option>
                                    <option value="gaode.roads">高德透明路网</option>
                                    <option value="tencent.satellite">腾讯卫星</option>
                                    <option value="tianditu.satellite">天地图影像</option>
                                    <option value="baidu.satellite">百度卫星</option>
                                    <option value="google.satellite">Google 卫星</option>
                                    <option value="bing.satellite">Bing 卫星</option>
                                    <option value="arcgis.satellite">ArcGIS 影像</option>
                                    <option value="none">无</option>
                                </select>
                            </label>
                        </div>
                    </section>

                    <section class="settings-section">
                        <h2>输出内容</h2>
                        <div class="output-options">
                            <label class="output-option">
                                <input id="export-satellite-tiles" type="checkbox">
                                <span>卫星 XYZ 切片</span>
                            </label>
                            <label class="output-option">
                                <input id="export-gis-tiles" type="checkbox">
                                <span>GIS XYZ 切片</span>
                            </label>
                            <label class="output-option">
                                <input id="export-satellite-merged" type="checkbox">
                                <span>卫星合并大图</span>
                            </label>
                            <label class="output-option">
                                <input id="export-gis-merged" type="checkbox">
                                <span>GIS 合并大图</span>
                            </label>
                            <label class="output-option">
                                <input id="export-fbx" type="checkbox">
                                <span>FBX 切片与网格</span>
                            </label>
                            <label class="form-field" style="padding: 6px 8px">
                                <span>FBX 数据来源</span>
                                <select id="export-fbx-source">
                                    <option value="satellite">卫星图</option>
                                    <option value="gis">GIS</option>
                                </select>
                            </label>
                        </div>
                    </section>

                    <section class="settings-section">
                        <h2>输出参数</h2>
                        <div class="form-grid">
                            <label class="form-field">
                                <span>大图格式</span>
                                <select id="export-merged-format">
                                    <option value="png">PNG</option>
                                    <option value="jpg">JPG</option>
                                </select>
                            </label>
                            <label class="form-field">
                                <span>大图最大边</span>
                                <input id="export-merged-resolution" type="number" min="256"
                                       step="256" value="16384">
                            </label>
                            <label class="form-field">
                                <span>FBX 贴图尺寸</span>
                                <select id="export-fbx-size">
                                    <option value="1024">1024</option>
                                    <option value="2048">2048</option>
                                    <option value="4096" selected>4096</option>
                                    <option value="8192">8192</option>
                                    <option value="16384">16384</option>
                                </select>
                            </label>
                            <label class="output-option" style="border: 0; padding: 16px 0 0">
                                <input id="export-building-height-colors" type="checkbox">
                                <span>建筑按高度着色</span>
                            </label>
                        </div>
                    </section>
                </div>

                <div class="export-column">
                    <section class="settings-section">
                        <h2>GIS 输出组</h2>
                        <div id="export-gis-groups" class="gis-group-list"></div>
                    </section>

                    <section class="settings-section">
                        <h2>输出位置</h2>
                        <div class="form-grid">
                            <label class="form-field full">
                                <span>卫星输出目录</span>
                                <input id="export-satellite-output" type="text">
                            </label>
                            <label class="form-field full">
                                <span>GIS 输出目录</span>
                                <input id="export-gis-output" type="text"
                                       value="cache/高德地图/gis数据/输出">
                            </label>
                        </div>
                    </section>

                    <div class="export-footer">
                        <span id="export-validation-message" class="validation-message"></span>
                        <button id="export-cancel" class="secondary-command" type="button"
                                data-action="cancel-export-config">取消</button>
                        <button id="export-submit" class="primary-command" type="button"
                                data-action="submit-export">加入导出队列</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section id="task-page" class="workspace-page" style="display: none">
        <header id="task-page-header" class="page-header">
            <h1>导出任务</h1>
            <span class="page-header-summary">所有导出记录与实时进度</span>
            <div class="page-header-spacer"></div>
            <button id="tasks-clear-finished" class="secondary-command" type="button"
                    data-action="clear-finished-export-tasks"
                    title="移除成功、失败和已取消的任务记录">移除已结束任务</button>
            <button id="tasks-new-export" class="primary-command" type="button"
                    data-action="open-export-config">新建导出</button>
            <button id="tasks-back-preview" class="secondary-command" type="button"
                    data-action="back-to-preview">返回</button>
        </header>
        <div class="task-summary-band">
            <span>排队 <strong id="task-count-queued">0</strong></span>
            <span>运行 <strong id="task-count-running">0</strong></span>
            <span>完成 <strong id="task-count-succeeded">0</strong></span>
            <span>失败/取消 <strong id="task-count-failed">0</strong></span>
        </div>
        <div class="page-content">
            <div id="export-task-list" class="task-list">
                <div class="task-empty">暂无导出任务</div>
            </div>
        </div>
    </section>
</body>
</html>
