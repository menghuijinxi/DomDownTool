<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>天地图预览</title>
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #263842;
        }

        #status {
            position: fixed;
            top: 50%;
            left: 50%;
            padding: 7px 10px;
            background: rgba(11, 19, 24, 0.86);
            color: #c7d4db;
            font: 13px "Microsoft YaHei", "Segoe UI", sans-serif;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="status">正在加载天地图...</div>
    <script>
        const parameters = new URLSearchParams(window.location.search);
        const longitude = Number(parameters.get("longitude"));
        const latitude = Number(parameters.get("latitude"));
        const zoom = Number(parameters.get("zoom"));
        const token = "75f0434f240669f4a2df6359275146d2";
        const status = document.getElementById("status");
        let map = null;

        function showFailure() {
            status.textContent = "天地图预览加载失败";
        }

        function initializeMap() {
            if (!window.T || !Number.isFinite(longitude) || !Number.isFinite(latitude)) {
                showFailure();
                return;
            }

            map = new T.Map("map", { minZoom: 1, maxZoom: 18 });
            map.centerAndZoom(new T.LngLat(longitude, latitude), Math.min(Math.max(zoom, 1), 18));
            const imageUrl = "https://t0.tianditu.gov.cn/img_w/wmts?service=wmts&request=GetTile" +
                "&version=1.0.0&LAYER=img&style=default&tilematrixset=w&format=tiles" +
                "&TileMatrix={z}&TileRow={y}&TileCol={x}&tk=" + token;
            map.addLayer(new T.TileLayer(imageUrl, { minZoom: 1, maxZoom: 18 }));
            status.hidden = true;
        }

        window.addEventListener("message", (event) => {
            const request = event.data;
            if (request?.type !== "dom-down-tool-locate" || !map ||
                !Number.isFinite(request.longitude) || !Number.isFinite(request.latitude)) {
                return;
            }

            map.centerAndZoom(
                new T.LngLat(request.longitude, request.latitude),
                map.getZoom()
            );
        });

        const script = document.createElement("script");
        script.src = "https://api.tianditu.gov.cn/api?v=4.0&tk=" + token;
        script.onload = initializeMap;
        script.onerror = showFailure;
        document.head.appendChild(script);
    </script>
</body>
</html>
